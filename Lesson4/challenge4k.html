<style>
  .stretch-button {
    background-color: green;
    color: white;
    border: none;
    font-size: 16px;
    padding-top:7px;
    padding-bottom:7px;
    cursor: pointer;

    padding-left:15px;
    padding-right:15px;
    margin-left: 10px;
    margin-right: 10px;

    transition: padding 0.15s,
      margin 0.15s;
  }

  .stretch-button:hover {
    padding-left: 25px;
    padding-right: 25px;
    margin-left: 0px;
    margin-right: 0px;
  }
</style>

<button class="stretch-button"> One</button>

<button class="stretch-button">Three</button>
